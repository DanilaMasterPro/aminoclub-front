name: Deploy (dev)

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-front
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Sync source to server
        run: |
          rsync -az --delete \
            --exclude '.git' \
            --exclude 'node_modules' \
            --exclude '.next' \
            --exclude '.env' \
            --exclude 'test-results' \
            --exclude 'playwright-report' \
            -e "ssh -i ~/.ssh/id_ed25519" \
            ./ ${{ secrets.DEPLOY_SSH_USER }}@${{ secrets.DEPLOY_SSH_HOST }}:/home/${{ secrets.DEPLOY_SSH_USER }}/aminoclub-front/

      - name: Install, build, restart
        run: |
          ssh -i ~/.ssh/id_ed25519 ${{ secrets.DEPLOY_SSH_USER }}@${{ secrets.DEPLOY_SSH_HOST }} '
            set -e
            export PATH="$HOME/.bun/bin:$PATH"
            cd ~/aminoclub-front
            bun install
            bun run build
            pm2 reload aminoclub-front --update-env
          '
